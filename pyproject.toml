[tool.poetry]
name = "spotify-mcp-assistant"
version = "0.2.0"
description = "A Spotify MCP server for playlists, playback, queues, and favorites"
readme = "README.md"
packages = [{ include = "spotify_mcp_assistant" }]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
fastmcp = "^4.0.10"
httpx = ">=0.24.0"
pydantic = ">=2.0.0"
python-dotenv = ">=1.0.0"
tomlkit = ">=0.13,<1"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0.0"

[tool.poetry.scripts]
spotify-mcp-assistant = "spotify_mcp_assistant.server:main"
spotify-mcp-auth = "spotify_mcp_assistant.oauth:main"

[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"
